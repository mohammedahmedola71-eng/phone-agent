<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#7cc6f2" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#d9f1ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#5aa9db" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1">
      <stop offset="0" stop-color="#2f8fd6"/>
      <stop offset=".4" stop-color="#6cc0f5"/>
      <stop offset="1" stop-color="#2479b8"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset=".4" stop-color="#3d6aa3"/>
      <stop offset="1" stop-color="#1b3250"/>
    </linearGradient>
    <clipPath id="clip">
      <path d="M70 70 H130 Q132 90 150 110 Q165 125 165 150 V350 Q165 375 140 375 H60 Q35 375 35 350 V150 Q35 125 50 110 Q68 90 70 70 Z"/>
    </clipPath>
  </defs>
  <ellipse cx="100" cy="385" rx="70" ry="8" fill="#000" opacity=".15"/>
  <!-- cap -->
  <rect x="68" y="22" width="64" height="30" rx="6" fill="url(#cap)"/>
  <rect x="82" y="8" width="36" height="16" rx="8" fill="none" stroke="#1f3a5f" stroke-width="5"/>
  <rect x="72" y="50" width="56" height="10" rx="3" fill="#2b5084"/>
  <!-- bottle -->
  <path d="M70 60 H130 V70 Q132 90 150 110 Q165 125 165 150 V350 Q165 375 140 375 H60 Q35 375 35 350 V150 Q35 125 50 110 Q68 90 70 70 Z" fill="url(#body)" stroke="#3b82b8" stroke-width="2"/>
  <!-- water -->
  <g clip-path="url(#clip)">
    <path d="M30 170 Q65 160 100 170 T170 170 V380 H30 Z" fill="url(#water)" opacity=".85"/>
  </g>
  <!-- ridges -->
  <g stroke="#3b82b8" stroke-width="1.5" opacity=".35" fill="none">
    <path d="M37 230 Q100 245 163 230"/>
    <path d="M37 290 Q100 305 163 290"/>
  </g>
  <!-- highlight -->
  <path d="M52 140 Q47 150 47 170 V340" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".6"/>
  <!-- label -->
  <rect x="55" y="205" width="90" height="60" rx="6" fill="#fff" opacity=".85"/>
  <text x="100" y="242" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2479b8">WATER</text>
</svg>
